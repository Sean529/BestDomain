name: Cloudflare 优选 IP 自动更新

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'  # 每小时运行一次

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: pip install requests

      - name: 执行更新脚本
        env:
          DNSPOD_ID: ${{ secrets.DNSPOD_ID }}
          DNSPOD_TOKEN: ${{ secrets.DNSPOD_TOKEN }}
          DOMAINS: ${{ secrets.DOMAINS }}
          SUB_DOMAINS: ${{ secrets.SUB_DOMAINS }}
        run: python bestdomain.py
